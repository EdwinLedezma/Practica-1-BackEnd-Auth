name: Security and TLS verification
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify authentication, authorization and real HTTPS
        run: mvn --batch-mode verify
      - name: Generate local certificate and random credentials
        run: sh scripts/setup-local.sh
      - name: Smoke test TLS 1.0, 1.1, 1.2, 1.3 and API
        shell: bash
        run: |
          source .local/secrets.sh
          java -jar target/backend-auth-1.0.0.jar > .local/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 scripts/verify_https.py --wait 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: target/surefire-reports/
